spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3309/odontologico_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port = 8088

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# SESION (JWT) - la clave debe tener 32 caracteres o mas. Cambiala antes de publicar.
# ---------------------------------------------------------------------------
app.jwt.secret=cambia-esta-clave-jwt-odontologico-por-una-propia-2026
app.jwt.expiracion-horas=8

# ---------------------------------------------------------------------------
# INGRESO CON GOOGLE (boton "Iniciar sesion con Google")
# 1) console.cloud.google.com > APIs & Services > Credentials
# 2) crea un OAuth Client ID de tipo "Web application"
# 3) en "Authorized JavaScript origins" agrega: http://localhost:4200
# 4) pega aqui el Client ID. Mientras este vacio, el boton de Google se oculta.
# 5) dominio-permitido es opcional: si lo defines, solo los gmail de ese
#    dominio pueden entrar (ej. gmail.com).
# ---------------------------------------------------------------------------
app.google.client-id=
app.google.dominio-permitido=

# ---------------------------------------------------------------------------
# CORREO PARA RECUPERAR CONTRASENA (Gmail SMTP)
# En la cuenta de Gmail activa verificacion en 2 pasos y genera una
# "Contrasena de aplicacion" de 16 digitos. No uses tu contrasena normal.
# ---------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.correo.nombre-remitente=Consultorio Odontologico

# Correos Gmail registrados de los odontologos. Cambia estos valores por los
# Gmail reales: son los que autorizan el ingreso con Google y el envio del
# codigo de recuperacion. Deben ser unicos por odontologo.
app.odontologos.dr-gina.correo=gina.odontologia@gmail.com
app.odontologos.dr-ruben.correo=ruben.odontologia@gmail.com